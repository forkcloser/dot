# aqua — Declarative CLI Version Manager — https://aquaproj.github.io/
checksum:
  enabled: true
  require_checksum: true
  supported_envs:
    - darwin/arm64
    - linux/amd64
    - linux/arm64
    - windows/amd64
    - windows/arm64

registries:
  - type: standard
    ref: v4.572.0 # renovate: depName=aquaproj/aqua-registry
  - name: local
    type: local
    path: ../.limen/aqua-registry.yaml

packages:
  # Every pin is the one-line name@version form and stays so (limen fix
  # collapses a two-line `version:` pin): `aqua update` rewrites only that form
  # and treats a separate `version:` key as hand-held, and Renovate reads only
  # that form.
  # No Go-built tool is pinned here: every one is a `tool` directive in
  # tools/go.mod, built by the pinned go (book/tooling.md, "Go-built tools
  # are go.mod tools"). aqua's go_install would build it once per tool
  # version, with whichever go ran first, and share that binary.
  # --- farcloser tools (local registry; standard once registered upstream) ---
  - name: farcloser/limen@v0.9.0 # renovate: depName=farcloser/limen
    registry: local
  - import: ../.limen/aqua.yaml
