# The native dot the tests hold the command to (`just oracle`): Graphviz's own,
# built unpatched by forkcloser/testbin, one archive per platform the tests run
# on, moved together, pinned by version and digest (book/tooling.md, "Pinned
# artifacts beyond aqua"). testbin attests its archives, and the entries are
# held to the attestation. Renovate proposes the bumps from the renovate:
# lines, and `limen pins refresh` recomputes a digest a bump left behind.
#
# The release these name is the Graphviz the engine embeds, the one
# github.com/forkcloser/go-graphviz in go.mod is built from: `just test` fails
# on a native dot of another release. They move in the change that moves that
# requirement to another Graphviz, and not before.
pins:
  - name: dot-linux-amd64
    renovate: github-releases forkcloser/testbin
    version: 0.5.0
    url: https://github.com/forkcloser/testbin/releases/download/v${version}/graphviz-linux-amd64.tar.gz
    verify: github-attestation forkcloser/testbin forkcloser/testbin/.github/workflows/release.yaml
    digest:
      version: 0.5.0
      source: 82a438a43fa5157a2cdff9556d65c54078df1254af22bf5916e366379f3eb35f
      sha256: 337dac72259d1025333e080f447c5cba65f6ec7d4d71e8a81b50652586b7e654
